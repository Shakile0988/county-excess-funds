name: County Excess Funds Scrape

on:
  repository_dispatch:
    types: [monthly-scrape]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python src/main.py
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}

      - name: Commit updated state (dedupe tracker)
        run: |
          git config user.name "excess-funds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen_files.json
          git diff --cached --quiet || git commit -m "chore: update seen files state [skip ci]"
          git push
